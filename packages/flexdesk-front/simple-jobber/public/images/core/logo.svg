<svg width="136" height="136" viewBox="0 0 136 136" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer light sky-blue ring -->
  <circle cx="68" cy="68" r="68" fill="#87CEEB"/>
  
  <!-- Inner medium blue ring -->
  <circle cx="68" cy="68" r="60" fill="#4A90E2"/>
  
  <!-- White background circle -->
  <circle cx="68" cy="68" r="52" fill="white"/>
  
  <!-- Stylized letter F with gradient and ribbon effect -->
  <defs>
    <linearGradient id="fGradient" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" style="stop-color:#6BB6FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Vertical stem of F - broad and curved -->
  <path d="M 44 30 Q 44 28 46 28 L 56 28 Q 58 28 58 30 L 58 90 Q 58 92 56 92 L 46 92 Q 44 92 44 90 Z" fill="url(#fGradient)"/>
  
  <!-- Top horizontal bar - sweeping upward with pointed tip -->
  <path d="M 44 30 Q 44 26 48 24 L 70 20 Q 76 18 80 24 L 78 30 Q 76 32 72 31 L 56 33 Q 52 34 48 33 Z" fill="url(#fGradient)"/>
  
  <!-- Top bar pointed tip overlay for 3D effect -->
  <path d="M 76 22 L 80 20 L 78 26 L 74 27 Z" fill="#2E5C8A" opacity="0.7"/>
  
  <!-- Middle horizontal bar - shorter, angled downward -->
  <path d="M 44 58 Q 44 56 48 55 L 62 53 Q 66 52 68 55 L 66 60 Q 64 62 60 61 L 50 63 Q 46 64 44 63 Z" fill="url(#fGradient)"/>
  
  <!-- Middle bar overlay for depth -->
  <path d="M 64 54 L 68 53 L 66 58 L 62 59 Z" fill="#2E5C8A" opacity="0.7"/>
  
  <!-- Additional ribbon fold effect on vertical stem -->
  <path d="M 46 30 L 50 30 L 50 54 L 46 54 Z" fill="#4A90E2" opacity="0.5"/>
</svg>
